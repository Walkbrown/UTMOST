name: netatmo-consolidate

on:
  schedule:
    - cron: "25 3 * * *"   # 03:25 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netatmo-scrape      # shares the scraper's group to avoid push races
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python consolidate.py --input-dir data --output-dir daily --min-age-days 1
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data daily
          if git diff --cached --quiet; then echo "Nothing to consolidate."; exit 0; fi
          git commit -m "data: consolidate netatmo daily files"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $(( RANDOM % 10 + 5 ))
          done
          exit 1
